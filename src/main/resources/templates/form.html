<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title th:text="${editMode} ? 'Edit Employee' : 'Add Employee'">
    Employee
  </title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="container mt-4">

  <h2 th:text="${editMode} ? 'Edit Employee' : 'Add New Employee'">
    Employee
  </h2>

  <form
      th:action="${editMode} ? @{/update/{id}(id=${employee.id})} : @{/add}"
      method="post">

    <div class="mb-3">

      <label>ID</label>

      <input
          type="number"
          class="form-control"
          name="id"
          th:value="${employee.id}"
          required
          th:readonly="${editMode}">
    </div>

    <div class="mb-3">

      <label>Name</label>

      <input
          type="text"
          class="form-control"
          name="name"
          th:value="${employee.name}"
          required>
    </div>

    <div class="mb-3">

      <label>Role</label>

      <input
          type="text"
          class="form-control"
          name="role"
          th:value="${employee.role}"
          required>
    </div>

    <button
        type="submit"
        class="btn btn-success"
        th:text="${editMode} ? 'Update Employee' : 'Save Employee'">
      Save
    </button>

    <a href="/" class="btn btn-secondary">
      Cancel
    </a>

  </form>

</body>
</html>
